# Cargar este archivo explícitamente con el lanzador; no hereda application.properties.
spring.application.name=Silabus-dev-local
server.address=127.0.0.1
server.port=8081
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.flyway.enabled=false
spring.sql.init.mode=never
spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false
app.allowed-origins=http://localhost:3001
# Valor efímero generado al iniciar. No se utiliza ni persiste una clave de producción.
security.jwt.secret=${random.uuid}${random.uuid}
security.jwt.expiration-ms=86400000
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
