# Configuración sintética exclusiva de pruebas: no contiene credenciales externas.
spring.datasource.url=jdbc:h2:mem:ci-${random.uuid};DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.hbm2ddl.halt_on_error=true
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.flyway.enabled=false
spring.sql.init.mode=never
spring.main.banner-mode=off
security.jwt.secret=placeholder-ci-only-jwt-key-not-for-production-0123456789
security.jwt.expiration-ms=3600000
app.allowed-origins=http://localhost:3000
resend.api.key=re_test_placeholder
resend.from.email=ci@example.invalid
gemini.api.key=placeholder-ci-no-network
