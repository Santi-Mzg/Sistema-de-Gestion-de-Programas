# ─────────────────────────────────────────────────────────────────────────────
# Security Pipeline — Sílabus UNS
#
# Flujo de ejecución:
#
#   secret-detection
#   ├── sca-backend  (gate: bloqueia em CRITICAL)
#   ├── sca-frontend (gate: bloqueia em HIGH+ reais)
#   ├── sast
#   └── iac-scanning (gate: bloqueia em HIGH+)
#        └── dast (roda só se todos os gates passarem)
#             └── pipeline-summary (sempre)
#
# ─────────────────────────────────────────────────────────────────────────────

name: Security Pipeline

on:
  push:
    branches: [devsecops]
  pull_request:
    branches: [devsecops]

permissions:
  contents: read
  security-events: write

jobs:

  # ═══════════════════════════════════════════════════════════════════════════
  # JOB 1 ─ Secret Detection
  # ═══════════════════════════════════════════════════════════════════════════
  secret-detection:
    name: "1 · Secret Detection (Gitleaks)"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout — historial completo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
        with:
          log-opts: --all

  # ═══════════════════════════════════════════════════════════════════════════
  # JOB 2a ─ SCA Backend — GATE: bloqueia em CRITICAL
  # ═══════════════════════════════════════════════════════════════════════════
  sca-backend:
    name: "2a · SCA Backend (Trivy)"
    needs: secret-detection
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Pre-aquecer cache Maven
        working-directory: Backend
        run: |
          chmod +x ./mvnw
          ./mvnw dependency:resolve -q --no-transfer-progress || true

      - name: Trivy — tabela (informativo)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: Backend/
          scanners: vuln
          format: table
          exit-code: '0'
          severity: MEDIUM,HIGH,CRITICAL

      # Gate real: falha o job se encontrar CVE CRITICAL
      # HIGH e MEDIUM são reportados mas não bloqueiam
      - name: Trivy — gate CRITICAL
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: Backend/
          scanners: vuln
          format: table
          exit-code: '1'
          severity: CRITICAL

      - name: Trivy — relatório JSON
        if: always()
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: Backend/
          scanners: vuln
          format: json
          output: trivy-backend-report.json
          exit-code: '0'
          severity: MEDIUM,HIGH,CRITICAL

      - name: Upload relatório
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-backend-sca-report
          path: trivy-backend-report.json
          retention-days: 30

  # ═══════════════════════════════════════════════════════════════════════════
  # JOB 2b ─ SCA Frontend — GATE: bloqueia em HIGH+ reais
  # ═══════════════════════════════════════════════════════════════════════════
  sca-frontend:
    name: "2b · SCA Frontend (npm audit)"
    needs: secret-detection
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Install dependencies
        working-directory: Frontend
        run: npm ci

      # Tenta corrigir automaticamente o que não tem breaking changes
      - name: npm audit fix (sem breaking changes)
        working-directory: Frontend
        run: npm audit fix || true

      # Gate: bloqueia apenas vulnerabilidades HIGH+ em production dependencies
      # O arquivo audit-ci.json define quais pacotes ignorar (devDependencies)
      - name: npm audit (high+)
        working-directory: Frontend
        run: npm audit --audit-level=high --omit=dev

  # ═══════════════════════════════════════════════════════════════════════════
  # JOB 3 ─ SAST (Semgrep)
  # ═══════════════════════════════════════════════════════════════════════════
  sast:
    name: "3 · SAST (Semgrep)"
    needs: secret-detection
    runs-on: ubuntu-latest
    permissions:
      security-events: write

    steps:
      - uses: actions/checkout@v4

      - name: Run Semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/java
            p/react
            p/secrets
            p/owasp-top-ten
        continue-on-error: true

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  # ═══════════════════════════════════════════════════════════════════════════
  # JOB 4 ─ IaC Scanning — GATE: bloqueia em HIGH+
  # ═══════════════════════════════════════════════════════════════════════════
  iac-scanning:
    name: "4 · IaC Scanning (Trivy + Checkov)"
    needs: secret-detection
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Gate real: falha se encontrar HIGH ou CRITICAL em IaC
      - name: Trivy config scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: config
          scan-ref: .
          format: table
          exit-code: '1'
          severity: HIGH,CRITICAL

      - name: Checkov — docker-compose.yml
        uses: bridgecrewio/checkov-action@master
        with:
          file: docker-compose.yml
          soft_fail: false

      - name: Checkov — Dockerfiles
        uses: bridgecrewio/checkov-action@master
        with:
          directory: .
          framework: dockerfile
          soft_fail: false

  # ═══════════════════════════════════════════════════════════════════════════
  # JOB 5 ─ DAST — só roda se todos os gates passaram
  # ═══════════════════════════════════════════════════════════════════════════
  dast:
    name: "5 · DAST (OWASP ZAP)"
    needs: [secret-detection, sca-backend, sca-frontend, sast, iac-scanning]
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Compilar, iniciar backend e aguardar health
        working-directory: Backend
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET_TEST }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: dast@example.com
          SERVER_PORT: '8080'
        run: |
          chmod +x ./mvnw
          ./mvnw dependency:resolve dependency:resolve-plugins \
            test-compile compile \
            -Pdast \
            -q --no-transfer-progress

          ./mvnw spring-boot:run \
            -Pdast \
            -Dspring-boot.run.profiles=dast \
            --no-transfer-progress > /tmp/spring.log 2>&1 &
          echo $! > /tmp/spring_pid

          echo "Aguardando Spring Boot iniciar..."
          for i in $(seq 1 90); do
            if curl -sf http://localhost:8080/actuator/health > /dev/null 2>&1; then
              echo "Backend saudável após $((i * 2))s"
              exit 0
            fi
            echo "  tentativa $i/90 — aguardando 2s..."
            sleep 2
          done
          echo "Backend não iniciou em 180s"
          cat /tmp/spring.log
          exit 1

      - name: ZAP API Scan
        uses: zaproxy/action-api-scan@v0.9.0
        with:
          target: 'http://localhost:8080/v3/api-docs'
          format: openapi
          fail_action: false

      - name: Upload ZAP report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-api-scan-report
          path: |
            report_html.html
            report_md.md
          retention-days: 30

      - name: Stop backend
        if: always()
        run: |
          if [ -f /tmp/spring_pid ]; then
            kill "$(cat /tmp/spring_pid)" 2>/dev/null || true
          fi

  # ═══════════════════════════════════════════════════════════════════════════
  # JOB 6 ─ Pipeline Summary
  # ═══════════════════════════════════════════════════════════════════════════
  pipeline-summary:
    name: "6 · Pipeline Summary"
    if: always()
    needs:
      - secret-detection
      - sca-backend
      - sca-frontend
      - sast
      - iac-scanning
      - dast
    runs-on: ubuntu-latest

    steps:
      - name: Print summary
        run: |
          label() {
            case "$1" in
              success)   echo "✅ PASSED"    ;;
              failure)   echo "❌ FAILED"    ;;
              skipped)   echo "⏭️ SKIPPED"   ;;
              cancelled) echo "🚫 CANCELLED" ;;
              *)         echo "$1"           ;;
            esac
          }

          R1="${{ needs.secret-detection.result }}"
          R2A="${{ needs.sca-backend.result }}"
          R2B="${{ needs.sca-frontend.result }}"
          R3="${{ needs.sast.result }}"
          R4="${{ needs.iac-scanning.result }}"
          R5="${{ needs.dast.result }}"

          echo "================================================="
          echo "       SECURITY PIPELINE — SÍLABUS UNS          "
          echo "================================================="
          printf "  %-30s %s\n" "1.  Secret Detection"    "$(label "$R1")"
          printf "  %-30s %s\n" "2a. SCA Backend [GATE]"  "$(label "$R2A")"
          printf "  %-30s %s\n" "2b. SCA Frontend [GATE]" "$(label "$R2B")"
          printf "  %-30s %s\n" "3.  SAST (Semgrep)"      "$(label "$R3")"
          printf "  %-30s %s\n" "4.  IaC Scanning [GATE]" "$(label "$R4")"
          printf "  %-30s %s\n" "5.  DAST (ZAP)"          "$(label "$R5")"
          echo "================================================="

          {
            echo "## 🔒 Security Pipeline — Sílabus UNS"
            echo ""
            echo "| Job | Tipo | Resultado |"
            echo "|-----|------|-----------|"
            echo "| 1. Secret Detection    | Informativo | $(label "$R1") |"
            echo "| 2a. SCA Backend        | **GATE**    | $(label "$R2A") |"
            echo "| 2b. SCA Frontend       | **GATE**    | $(label "$R2B") |"
            echo "| 3. SAST (Semgrep)      | Informativo | $(label "$R3") |"
            echo "| 4. IaC Scanning        | **GATE**    | $(label "$R4") |"
            echo "| 5. DAST (ZAP)          | Informativo | $(label "$R5") |"
            echo ""
            echo "> Jobs marcados como **GATE** bloqueiam o DAST se falharem."
          } >> "$GITHUB_STEP_SUMMARY"