name: silabus-pruebas

services:
  postgres:
    image: postgres:17-alpine
    pull_policy: never
    restart: unless-stopped
    environment:
      POSTGRES_DB: silabus_pruebas
      POSTGRES_USER: silabus
      # Solo para datos sintéticos locales; no reutilizar como configuración de producción.
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U silabus -d silabus_pruebas"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  postgres_data:
